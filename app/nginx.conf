# Nginx para el SPA de FitDesk. Hash routing (#/ruta) no necesita fallback, pero
# se deja try_files por si se usan rutas por path. Assets estáticos cacheados.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para JS/CSS/JSON.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: MISMO ORIGEN. Se proxya /api/* al backend Quarkus (servicio `backend` del
    # compose) → el frontend usa URLs relativas, sin CORS ni IP hardcodeada.
    # timeout alto por el proxy al HelpDesk; body grande por los adjuntos.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
        client_max_body_size 30m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index no se cachea (para tomar bundles nuevos); los assets con hash sí.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
