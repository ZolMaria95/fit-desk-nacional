<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitDesk se mudó</title>
  <!-- Redirección sin JS (fallback). El JS de abajo redirige un poco antes con replace(). -->
  <meta http-equiv="refresh" content="2; url=https://fitdesk.fit-bank.com/" />
  <link rel="canonical" href="https://fitdesk.fit-bank.com/" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f9; color: #16202a; padding: 24px;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f1720; color: #e6edf3; } .card { background: #16202a !important; border-color: #24303c !important; } .hint { color: #9fb0c0 !important; } }
    .card {
      width: 100%; max-width: 420px; text-align: center;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
      padding: 36px 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .logo { font-weight: 800; font-size: 26px; letter-spacing: -.5px; color: #048abf; margin-bottom: 8px; }
    h1 { font-size: 19px; margin: 4px 0 6px; font-weight: 700; }
    p { margin: 6px 0; font-size: 14.5px; line-height: 1.5; }
    .btn {
      display: inline-block; margin: 18px 0 6px; padding: 12px 22px;
      background: #048abf; color: #fff; text-decoration: none; border-radius: 10px;
      font-weight: 700; font-size: 15px;
    }
    .btn:hover { background: #0390bc; }
    .url { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 13px; word-break: break-all; }
    .hint { margin-top: 16px; font-size: 12.5px; color: #5a6470; }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid #048abf55; border-top-color:#048abf; border-radius:50%; animation:s .8s linear infinite; vertical-align:-2px; margin-right:6px; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">FitDesk</div>
    <h1>FitDesk se mudó a su nuevo hogar</h1>
    <p><span class="spin"></span>Redirigiéndote a la versión oficial…</p>
    <a class="btn" href="https://fitdesk.fit-bank.com/">Ir a FitDesk</a>
    <p class="url">fitdesk.fit-bank.com</p>
    <p class="hint">Si no te redirige automáticamente, usa el botón.<br />
      Nota: la nueva dirección es interna — necesitas estar en la <strong>red corporativa o VPN</strong>.</p>
  </div>
  <script>
    // replace() para no dejar esta página en el historial (el "atrás" no vuelve aquí).
    setTimeout(function () { window.location.replace('https://fitdesk.fit-bank.com/'); }, 1200);
  </script>
</body>
</html>
